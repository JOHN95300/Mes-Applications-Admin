<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Administration de mes applications</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:30px;width:min(100%,480px);box-shadow:0 12px 40px #12233b13}h1{font-size:1.5rem;margin:0 0 8px}p{color:#526176;line-height:1.5}label{display:block;font-weight:600;margin:18px 0 7px}input{width:100%;border:1px solid #b9c6d8;border-radius:9px;padding:12px;font:inherit}button{width:100%;margin-top:20px;background:#1557a4;color:white;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.muted{font-size:.88rem}.error{color:#a52b32}.success{color:#17673d}.app{padding:12px 14px;background:#f3f6fb;border-radius:9px;margin-top:10px}#dashboard{display:none}#message{min-height:1.4em}#signout{background:#e8eef7;color:#19395f}
  </style>
</head>
<body>
  <main class="panel">
    <section id="login">
      <h1>Administration des applications</h1>
      <p>Connexion réservée aux administrateurs autorisés.</p>
      <form id="loginForm">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">Se connecter</button>
      </form>
    </section>
    <section id="dashboard">
      <h1>Tableau de bord administrateur</h1>
      <p id="welcome"></p>
      <div class="app">⚖️ Juge Consulaire</div>
      <div class="app">📘 My American Vocabulary</div>
      <p class="muted">Version de test : gestion des accès et des appareils à venir.</p>
      <button id="signout" type="button">Se déconnecter</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient(
      'https://fkcdxxoqjmsmgxfehrmb.supabase.co',
      'sb_publishable_WDWVJeFxWlhgjFQar2RjuA_HOyWBanF'
    );
    const $ = (id) => document.getElementById(id);
    const message = (text, error = false) => {
      $('message').textContent = text;
      $('message').className = error ? 'error' : 'success';
    };
    const showLogin = () => { $('login').style.display = ''; $('dashboard').style.display = 'none'; };
    const showDashboard = (email) => {
      $('login').style.display = 'none'; $('dashboard').style.display = 'block';
      $('welcome').textContent = `Connecté : ${email}`;
      message('Accès administrateur confirmé.');
    };
    async function verifyAdmin() {
      const { data: userData, error: userError } = await supabase.auth.getUser();
      if (userError || !userData.user) { showLogin(); return; }
      const { data, error } = await supabase.rpc('is_app_admin');
      if (error || data !== true) {
        await supabase.auth.signOut();
        showLogin();
        message(error ? 'Vérification administrateur indisponible.' : 'Ce compte ne possède pas les droits administrateur.', true);
        return;
      }
      showDashboard(userData.user.email || 'administrateur');
    }
    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('submit').disabled = true;
      message('');
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: $('email').value.trim(), password: $('password').value
        });
        $('password').value = '';
        if (error) { message('Connexion impossible. Vérifie tes identifiants et la confirmation de ton e-mail.', true); return; }
        await verifyAdmin();
      } catch { message('Erreur de connexion au service. Réessaie.', true); }
      finally { $('submit').disabled = false; }
    });
    $('signout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      showLogin();
      message('Déconnexion effectuée.');
    });
    verifyAdmin().catch(() => { showLogin(); message('Service temporairement indisponible.', true); });
  </script>
</body>
</html>
